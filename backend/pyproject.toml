[project]
name = "backend"
version = "0.1.0"
description = " a mood-based semantic movie discovery platform "
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26.0",
    "chromadb>=1.5.7",
    "fastapi>=0.135.3",
    "python-dotenv>=1.1.0",
    "requests>=2.33.1",
    "sentence-transformers>=5.4.1",
    "tqdm>=4.67.0",
    "uvicorn>=0.44.0",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }